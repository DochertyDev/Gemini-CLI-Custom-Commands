## Critical Instructions

- **Replace ALL placeholder text** (items in [BRACKETS]) with actual, project-specific information based on your investigation.
- **Use bullet format with hyphens (-)** for lists, not asterisks (*).
- **Write substantive content**: Every section should contain real, meaningful information, not generic placeholders. Security notes should address actual security considerations. Troubleshooting should include realistic issues.
- **Add nested subsections** up to one level deep, to the Table of Contents when it improves navigation (e.g., Prerequisites, Backend Setup, Multiple Usage Scenarios).
- **If a README.md already exists** but does not follow this template structure:
  - Preserve all valuable existing content
  - Reorganize the content into the appropriate template sections
  - If existing content doesn't fit standard sections, create new custom sections that make sense
  - Maintain any project-specific details, links, or documentation
- **Populate sections accurately** based on:
  - Actual project files and structure
  - Real dependencies from package.json, requirements.txt, Cargo.toml, or similar
  - Actual scripts and commands found in the project
  - Genuine features and functionality you discover
- **For the "New!" announcement**: Include a real, recent feature or update if discoverable (check git history, changelog, recent commits). If none found, omit this section entirely.
- **Be comprehensive but concise**: Write in clear, professional prose. Features should use the format `**Feature Name:** Description`.
- **Add custom sections** for unique project aspects:
  - Multiple installation methods (PyPI vs source, Desktop app vs Docker vs Local)
  - Architecture diagrams
  - Data flow diagrams
  - Additional usage scenarios
  - Platform-specific instructions
- **Maintain consistent formatting**: 
  - Use hyphens (-) for all bullet lists
  - Use proper Markdown code blocks with language specifications
  - Keep image styling consistent with the template

## User Context

